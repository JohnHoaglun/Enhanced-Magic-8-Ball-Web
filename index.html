<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Enhanced Magic 8 Ball</title>
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="ball" id="ball" aria-hidden="true">
        <span class="ball-emblem">8</span>
      </div>
      <div class="answer-window" id="answer-window" hidden>
        <p class="answer-text" id="answer-text"></p>
      </div>
      <div class="controls" id="controls">
        <button type="button" class="shake-btn" id="shake-btn">Shake the Ball</button>
        <button type="button" class="ask-again-btn" id="ask-again-btn" hidden>Ask Again</button>
      </div>
      <p class="sr-only" id="live-region" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
